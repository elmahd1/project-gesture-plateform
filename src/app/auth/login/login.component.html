<div class="login-container">
  <div class="login-wrapper">
    <div class="logo-container"> 
      <span class="logo-text">Workflow</span>
    </div>
    
    <h1>Connexion</h1>
    <p class="subtitle">Veuillez vous connecter pour accéder à votre compte</p>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          type="email" 
          id="email" 
          formControlName="email" 
          placeholder="Entrez votre email"
          [ngClass]="{'is-invalid': submitted && f['email'].errors}"
        />
        <div *ngIf="submitted && f['email'].errors" class="error-message">
          <span *ngIf="f['email'].errors['required']">L'email est requis</span>
          <span *ngIf="f['email'].errors['email']">Format d'email invalide</span>
        </div>
      </div>
      
      <div class="form-group password-group">
        <label for="password">Mot de passe</label>
        <input 
          [type]="showPassword ? 'text' : 'password'" 
          id="password" 
          formControlName="password" 
          placeholder="Entrez votre mot de passe"
          [ngClass]="{'is-invalid': submitted && f['password'].errors}"
        />
        <button 
          type="button" 
          class="toggle-password" 
          (click)="togglePasswordVisibility()"
        >
          <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
        </button>
        <div *ngIf="submitted && f['password'].errors" class="error-message">
          <span *ngIf="f['password'].errors['required']">Le mot de passe est requis</span>
        </div>
      </div>
      
      <div *ngIf="error" class="error-message">
        {{ error }}
      </div>
      
      <div class="form-actions">
        <div class="remember-forgot">
          <div class="remember-me">
            <input type="checkbox" id="rememberMe" formControlName="rememberMe">
            <label for="rememberMe">Se souvenir de moi</label>
          </div>
          <a href="#" class="forgot-password">Mot de passe oublié?</a>
        </div>
        
        <button type="submit" class="btn-login" [disabled]="loading">
          {{ loading ? 'Connexion en cours...' : 'Se connecter' }}
        </button>
      </div>
    </form>
    
    <div class="register-link">
      <p>Pas encore de compte? <a routerLink="/auth/register">S'inscrire</a></p>
    </div>
  </div>
</div>
